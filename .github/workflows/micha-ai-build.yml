name: Build MICHa AI APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'micha-ai/**'
      - '.github/workflows/micha-ai-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        working-directory: micha-ai
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MICHa-AI-v0.1-debug
          path: micha-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
